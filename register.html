<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Registration - LifeLink</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🩸 LifeLink</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="register.html">
                            Become a Donor
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="request.html">
                            Request Blood
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="donors.html">
                            Find Donors
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center text-danger mb-2">
                            Become a Blood Donor
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Register yourself and help save lives.
                        </p>


                        <form id="donorForm">

                            <!-- Name -->

                            <div class="mb-3">

                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>


                            <!-- Phone -->

                            <div class="mb-3">

                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    name="phone"
                                    placeholder="10-digit phone number"
                                    maxlength="10"
                                    required
                                >

                            </div>


                            <!-- Age -->

                            <div class="mb-3">

                                <label for="age" class="form-label">
                                    Age
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="age"
                                    name="age"
                                    min="18"
                                    max="65"
                                    placeholder="Enter your age"
                                    required
                                >

                                <div class="form-text">
                                    Donor age must be between 18 and 65.
                                </div>

                            </div>


                            <!-- Blood Group -->

                            <div class="mb-3">

                                <label for="bloodGroup" class="form-label">
                                    Blood Group
                                </label>

                                <select
                                    class="form-select"
                                    id="bloodGroup"
                                    name="bloodGroup"
                                    required
                                >

                                    <option value="">Select blood group</option>

                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>

                                </select>

                            </div>


                            <!-- City -->

                            <div class="mb-3">

                                <label for="city" class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="city"
                                    name="city"
                                    placeholder="Enter your city"
                                    required
                                >

                            </div>


                            <!-- Submit -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-danger btn-lg"
                                >
                                    Register as Donor
                                </button>

                            </div>

                        </form>


                        <div id="message" class="mt-3"></div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 LifeLink - Blood Donation Management System
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
