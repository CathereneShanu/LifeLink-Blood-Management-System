<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Blood - LifeLink</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🩸 LifeLink
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="register.html">
                            Become a Donor
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="request.html">
                            Request Blood
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="donors.html">
                            Find Donors
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center text-danger mb-2">
                            Request Blood
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Submit a request for blood assistance.
                        </p>


                        <form id="requestForm">

                            <div class="mb-3">
                                <label for="patientName" class="form-label">
                                    Patient Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="patientName"
                                    placeholder="Enter patient name"
                                    required
                                >
                            </div>


                            <div class="mb-3">
                                <label for="requesterName" class="form-label">
                                    Requester Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="requesterName"
                                    placeholder="Enter requester name"
                                    required
                                >
                            </div>


                            <div class="mb-3">
                                <label for="requesterPhone" class="form-label">
                                    Contact Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="requesterPhone"
                                    placeholder="10-digit phone number"
                                    maxlength="10"
                                    required
                                >
                            </div>


                            <div class="mb-3">
                                <label for="requestBloodGroup" class="form-label">
                                    Required Blood Group
                                </label>

                                <select
                                    class="form-select"
                                    id="requestBloodGroup"
                                    required
                                >
                                    <option value="">
                                        Select blood group
                                    </option>

                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>


                            <div class="mb-3">
                                <label for="units" class="form-label">
                                    Units Required
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="units"
                                    min="1"
                                    max="10"
                                    placeholder="Enter number of units"
                                    required
                                >
                            </div>


                            <div class="mb-3">
                                <label for="hospital" class="form-label">
                                    Hospital Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="hospital"
                                    placeholder="Enter hospital name"
                                    required
                                >
                            </div>


                            <div class="mb-3">
                                <label for="requestCity" class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="requestCity"
                                    placeholder="Enter city"
                                    required
                                >
                            </div>


                            <div class="mb-3">
                                <label for="urgency" class="form-label">
                                    Urgency
                                </label>

                                <select
                                    class="form-select"
                                    id="urgency"
                                    required
                                >
                                    <option value="">
                                        Select urgency
                                    </option>

                                    <option value="Normal">Normal</option>
                                    <option value="Urgent">Urgent</option>
                                    <option value="Emergency">Emergency</option>
                                </select>
                            </div>


                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-danger btn-lg"
                                >
                                    Submit Blood Request
                                </button>

                            </div>

                        </form>


                        <div id="requestMessage" class="mt-3"></div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 LifeLink - Blood Donation Management System
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
