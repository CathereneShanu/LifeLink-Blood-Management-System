<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Donors - LifeLink</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🩸 LifeLink
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="register.html">
                            Become a Donor
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="request.html">
                            Request Blood
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="donors.html">
                            Find Donors
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <section class="container py-5">

        <h2 class="text-center text-danger mb-2">
            Find Blood Donors
        </h2>

        <p class="text-center text-muted mb-4">
            View registered blood donors.
        </p>


        <div class="row justify-content-center mb-4">

            <div class="col-md-6">

                <label for="bloodFilter" class="form-label">
                    Filter by Blood Group
                </label>

                <select id="bloodFilter" class="form-select">

                    <option value="all">
                        All Blood Groups
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>

            </div>

        </div>


        <div id="donorList" class="row g-4">

            <div class="text-center">
                <div class="spinner-border text-danger"></div>
                <p class="mt-2">Loading donors...</p>
            </div>

        </div>

    </section>


    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 LifeLink - Blood Donation Management System
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
